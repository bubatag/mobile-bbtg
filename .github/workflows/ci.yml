
name: Mobile Bubatag - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicativo mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Gerar bundle Android
        run: npx expo export --platform android

      - name: Gerar bundle iOS
        run: npx expo export --platform ios
